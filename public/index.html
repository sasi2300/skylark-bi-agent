<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Skylark BI Agent</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
    #log { border: 1px solid #ccc; padding: 12px; height: 400px; overflow-y: auto; margin-bottom: 12px; }
    .msg { margin: 8px 0; }
    .user { font-weight: bold; }
    input { width: 80%; padding: 8px; }
    button { padding: 8px 16px; }
  </style>
</head>
<body>
  <h2>Skylark Business Intelligence Agent</h2>
  <div id="log"></div>
  <input id="input" placeholder="Ask about deals or work orders..." />
  <button onclick="send()">Send</button>

  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    async function send() {
      const message = input.value.trim();
      if (!message) return;
      addMsg("You: " + message, "user");
      input.value = "";

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      const data = await res.json();
      addMsg("Agent: " + data.answer, "agent");
      if (data.caveats?.length) {
        addMsg("⚠ " + data.caveats.join(" | "), "agent");
      }
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send();
    });
  </script>
</body>
</html>
