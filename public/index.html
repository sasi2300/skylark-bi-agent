<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SKYLARK · BI-AGENT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root {
    --bg: #05070a;
    --panel: #0a0e14;
    --hairline: #1b2430;
    --hairline-dim: #12181f;
    --text: #d9e2ec;
    --text-dim: #5e7086;
    --text-faint: #38455a;
    --phosphor: #4ade80;
    --phosphor-dim: #1f5c3d;
    --caution: #f0a83c;
    --user: #7fb3e0;
    --user-dim: #35516b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    justify-content: center;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% 0%, #0d1420 0%, var(--bg) 65%);
  }

  .frame {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 0 18px;
  }

  header {
    padding: 18px 2px 14px 2px;
    border-bottom: 1px solid var(--hairline);
  }

  .callsign-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .callsign {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--text);
  }

  .callsign span { color: var(--phosphor); }

  .link-status {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .link-status .led {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--phosphor);
    box-shadow: 0 0 6px 1px rgba(74, 222, 128, 0.7);
    animation: blink 2.4s ease-in-out infinite;
  }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .subline {
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    display: flex;
    gap: 16px;
  }

  .subline b { color: var(--text-dim); font-weight: 500; }

  .ticks {
    display: flex;
    margin-top: 12px;
    height: 5px;
    gap: 3px;
  }
  .ticks i {
    flex: 1;
    background: var(--hairline-dim);
    display: block;
  }
  .ticks i:nth-child(4n) { background: var(--hairline); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 18px 2px 16px 2px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  #log::-webkit-scrollbar { width: 5px; }
  #log::-webkit-scrollbar-thumb { background: var(--hairline); }

  .empty {
    margin: auto 0;
    text-align: center;
    color: var(--text-faint);
  }

  .empty .tag {
    font-size: 10.5px;
    letter-spacing: 0.14em;
    color: var(--phosphor-dim);
    margin-bottom: 12px;
  }

  .empty h2 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    margin: 0 0 20px 0;
    letter-spacing: 0.02em;
  }

  .presets {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 380px;
    margin: 0 auto;
  }

  .preset {
    text-align: left;
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid var(--hairline);
    background: var(--panel);
    padding: 9px 12px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .preset::before { content: "> "; color: var(--phosphor-dim); }
  .preset:hover { border-color: var(--phosphor-dim); color: var(--text); }

  .entry {
    padding: 8px 4px;
    border-bottom: 1px solid var(--hairline-dim);
    font-size: 13px;
    line-height: 1.6;
  }

  .entry-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 4px;
    font-size: 10px;
    letter-spacing: 0.08em;
  }

  .entry-head .ts { color: var(--text-faint); }

  .tag-usr { color: var(--user); font-weight: 600; }
  .tag-agt { color: var(--phosphor); font-weight: 600; }

  .entry-body { color: var(--text); padding-left: 2px; }
  .entry.user .entry-body { color: #c3d3e3; }

  .caution-block {
    margin-top: 8px;
    padding: 8px 10px;
    border-left: 2px solid var(--caution);
    background: rgba(240, 168, 60, 0.06);
    font-size: 11px;
    color: var(--caution);
    line-height: 1.7;
  }

  .caution-block .cheader {
    font-size: 10px;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
    opacity: 0.85;
  }

  .thinking {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 4px;
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.05em;
  }

  .thinking .cursor {
    width: 7px; height: 12px;
    background: var(--phosphor);
    animation: blink 0.9s steps(1) infinite;
  }

  form {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 2px 18px 2px;
    border-top: 1px solid var(--hairline);
  }

  .prompt-glyph {
    color: var(--phosphor-dim);
    font-size: 14px;
    flex-shrink: 0;
  }

  input[type="text"] {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    padding: 8px 0;
    letter-spacing: 0.01em;
  }

  input[type="text"]::placeholder { color: var(--text-faint); }

  button {
    background: transparent;
    border: 1px solid var(--phosphor-dim);
    color: var(--phosphor);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    padding: 9px 16px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  button:hover { background: rgba(74, 222, 128, 0.1); }
  button:disabled { opacity: 0.4; cursor: default; }

  @media (max-width: 480px) {
    .frame { padding: 0 12px; }
    .subline { flex-wrap: wrap; gap: 8px; }
  }
</style>
</head>
<body>
  <div class="frame">
    <header>
      <div class="callsign-row">
        <div class="callsign">SKYLARK <span>// BI-AGENT</span></div>
        <div class="link-status"><span class="led"></span>LINK ACTIVE</div>
      </div>
      <div class="subline">
        <span><b>SRC</b> monday.com</span>
        <span><b>BOARDS</b> deals · work-orders</span>
        <span><b>MODE</b> read-only</span>
      </div>
      <div class="ticks" id="ticks"></div>
    </header>

    <div id="log">
      <div class="empty" id="emptyState">
        <div class="tag">// AWAITING QUERY</div>
        <h2>Ask about pipeline or execution data</h2>
        <div class="presets">
          <div class="preset" data-q="How many deals are Won?">How many deals are Won?</div>
          <div class="preset" data-q="Total deal value in the Mining sector">Total deal value — Mining sector</div>
          <div class="preset" data-q="How many work orders are open?">How many work orders are open?</div>
          <div class="preset" data-q="Give me a leadership summary of the pipeline">Leadership summary of the pipeline</div>
        </div>
      </div>
    </div>

    <form id="chatForm">
      <span class="prompt-glyph">&gt;</span>
      <input id="input" type="text" placeholder="transmit query…" autocomplete="off" />
      <button type="submit" id="sendBtn">SEND</button>
    </form>
  </div>

  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const form = document.getElementById("chatForm");
    const sendBtn = document.getElementById("sendBtn");
    const emptyState = document.getElementById("emptyState");
    const ticksEl = document.getElementById("ticks");

    for (let i = 0; i < 48; i++) {
      const i_el = document.createElement("i");
      ticksEl.appendChild(i_el);
    }

    function ts() {
      const d = new Date();
      const p = (n) => String(n).padStart(2, "0");
      return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    }

    function clearEmptyState() {
      if (emptyState) emptyState.remove();
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function addEntry(text, sender, caveats) {
      const entry = document.createElement("div");
      entry.className = "entry " + sender;

      const head = document.createElement("div");
      head.className = "entry-head";
      head.innerHTML = `<span class="ts">${ts()}</span><span class="${sender === "user" ? "tag-usr" : "tag-agt"}">${sender === "user" ? "[USR]" : "[AGT]"}</span>`;
      entry.appendChild(head);

      const body = document.createElement("div");
      body.className = "entry-body";
      body.textContent = text;
      entry.appendChild(body);

      if (caveats && caveats.length) {
        const cav = document.createElement("div");
        cav.className = "caution-block";
        cav.innerHTML = `<div class="cheader">⚠ DATA CAUTION</div>` +
          caveats.map(c => escapeHtml(c)).join("<br/>");
        entry.appendChild(cav);
      }

      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    function addThinking() {
      const row = document.createElement("div");
      row.className = "thinking";
      row.id = "thinkingRow";
      row.innerHTML = `<span>processing telemetry</span><span class="cursor"></span>`;
      log.appendChild(row);
      log.scrollTop = log.scrollHeight;
    }

    function removeThinking() {
      const row = document.getElementById("thinkingRow");
      if (row) row.remove();
    }

    async function sendMessage(message) {
      clearEmptyState();
      addEntry(message, "user");
      input.value = "";
      sendBtn.disabled = true;
      addThinking();

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        removeThinking();
        addEntry(data.answer || "No response received.", "agent", data.caveats);
      } catch (err) {
        removeThinking();
        addEntry("Connection error — please retry.", "agent", []);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      sendMessage(message);
    });

    document.querySelectorAll(".preset").forEach((p) => {
      p.addEventListener("click", () => sendMessage(p.dataset.q));
    });

    input.focus();
  </script>
</body>
</html>
